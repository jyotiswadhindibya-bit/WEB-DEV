<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>MATHS TIME!</h1>
    <div class="calculator">
        <div id="display-bar"></div>
        <div class="input-btn">
            <div id="pt-1">
                <div id="btnac">AC</div>
                <div id="btnmod">mod</div>
                <div id="btnpercent">%</div>
                <div id="btndel">del</div>
            </div>
            <div id="pt-2">
                <div id="btn9">9</div>
                <div id="btn8">8</div>
                <div id="btn7">7</div>
                <div id="btnx">x</div>
            </div>
            <div id="pt-3">
                <div id="btn6">6</div>
                <div id="btn5">5</div>
                <div id="btn4">4</div>
                <div id="btn+">+</div>
        </div>
        <div id="pt-4">
               <div id="btn3">3</div>
               <div id="btn2">2</div>
               <div id="btn1">1</div>
               <div id="btn-">-</div>
        </div>
        <div id="pt-5">
               <div id="btn0">0</div>
               <div id="btndec">.</div>
               <div id="btn=">=</div>
               <div id="btn/">/</div>
           </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
